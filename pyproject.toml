[project]
name = "personal-wiki-gemma"
version = "0.1.0"
description = "POLECON 156 course wiki: a local Gemma + RAG CLI and harness"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
    "python-pptx>=1.0",
    "pypdf>=4.0",
    "pyyaml>=6.0",
    "psutil>=5.9",
]

[project.scripts]
wiki = "wikicli.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wikicli"]
